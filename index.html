<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para mi querida mamá Esperanza</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to right, #fde2e4, #e2f0cb, #c9e4de);
      text-align: center;
      color: #4e4e4e;
      padding: 40px 20px;
      animation: fadeIn 2s ease-in;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3em;
      color: #a471a1;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin: 15px auto;
      max-width: 600px;
      color: #5c5c5c;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .galeria img {
      width: 150px;
      height: auto;
      border-radius: 12px;
      border: 3px solid #ffe0ec;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .galeria img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    footer {
      margin-top: 50px;
      font-size: 1em;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Para mi querida mamá Esperanza 💖</h1>
  <p>
    Mamá, gracias por ser mi ejemplo de amor, fortaleza y ternura. Tu nombre significa esperanza, 
    y eso es exactamente lo que le das a mi vida cada día. ¡Te amo con todo mi corazón!
  </p>

  <div class="galeria">
    <img src="imagenes/foto1.jpg" alt="Recuerdo 1">
    <img src="imagenes/foto2.jpg" alt="Recuerdo 2">
    <img src="imagenes/foto3.jpg" alt="Recuerdo 3">
    <img src="imagenes/foto4.jpg" alt="Recuerdo 4">
  </div>

  <footer>
    Hecho con amor 💐 – Día de la Madre 2025
  </footer>
</body>
</html>
